<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>YeeHaw Founder Console</title>
<style>
:root{--bg:#080d18;--card:#101a2a;--line:#1d2b45;--ink:#eef3fb;--mute:#8da0bd;--lime:#b8f36b;--blue:#82b7ff;--warn:#ffb86b;--bad:#ff7a7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--blue)}h1,h2,h3{margin:0}h2{font-size:1.05rem;margin-bottom:10px}h3{font-size:.9rem;color:var(--mute);font-weight:600;margin:14px 0 6px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.brand{font-weight:900;color:var(--lime);letter-spacing:-.04em;font-size:1.1rem}.brand span{color:var(--ink)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}nav button{background:none;border:0;color:var(--mute);padding:8px 12px;border-radius:9px;font-weight:600;cursor:pointer}
nav button.on{background:#17263b;color:var(--lime)}
main{padding:16px;max-width:1280px;margin:0 auto}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kpi .v{font-size:1.6rem;font-weight:800;color:var(--lime)}.kpi .l{color:var(--mute);font-size:.78rem}.kpi .s{color:var(--mute);font-size:.72rem}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:.84rem;vertical-align:top}th{color:var(--mute);font-weight:600}
tr.click{cursor:pointer}tr.click:hover{background:#14233a}.wrap{overflow-x:auto}
input,select,textarea{background:#131f35;border:1px solid #2d4160;color:var(--ink);border-radius:9px;padding:7px 10px;font:inherit;max-width:100%}
input[type=checkbox]{width:auto}textarea{width:100%;min-height:90px;font-family:ui-monospace,monospace;font-size:.8rem}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lime);outline-offset:1px}
label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:.78rem}label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>label{flex:1;min-width:130px}
button.b{background:var(--lime);color:#101b0b;border:0;border-radius:9px;padding:8px 14px;font-weight:800;cursor:pointer}
button.b.alt{background:#1d2f4a;color:var(--ink)}button.b.red{background:#4a1d1d;color:#ffd0d0}button.b:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:.72rem;background:#1d2f4a;color:var(--ink)}.pill.red{background:#4a1d1d;color:#ffb0b0}.pill.warn{background:#4a3a1d;color:var(--warn)}.pill.ok{background:#1f3a1d;color:var(--lime)}
.mute{color:var(--mute)}.small{font-size:.76rem}.bar{height:8px;border-radius:4px;background:#1d2f4a;overflow:hidden}.bar>i{display:block;height:100%;background:var(--lime)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#17263b;border:1px solid var(--lime);padding:10px 16px;border-radius:10px;display:none;z-index:20;max-width:90vw}
#toast.err{border-color:var(--bad)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:#0c1424;border-left:1px solid var(--line);padding:16px;overflow:auto;transform:translateX(100%);transition:transform .15s;z-index:15}
#drawer.open{transform:none}
.login{max-width:380px;margin:12vh auto;text-align:center}.login .card{display:flex;flex-direction:column;gap:10px}
svg text{fill:var(--mute);font-size:10px}
</style>
</head>
