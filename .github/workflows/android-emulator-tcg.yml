name: Android emulator smoke (software emulation, no KVM)

# Experimental: runs the same smoke script on an ARM system image using QEMU
# software translation (TCG). Slow, but works without /dev/kvm. Results from
# this workflow are emulator results, never physical-device results.
on:
  workflow_dispatch:
  push:
    branches: ["integration/reconcile-main"]
    paths: [".github/workflows/android-emulator-tcg.yml"]

permissions:
  contents: read

jobs:
  tcg-smoke:
    name: API ${{ matrix.api-level }} ${{ matrix.arch }} (TCG)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - api-level: 23
            arch: armeabi-v7a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.11.1"
      - name: Put platform-tools and emulator on PATH
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "emulator"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
      - name: Run smoke test (software emulation)
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: true
          emulator-boot-timeout: 3000
          emulator-options: -no-window -accel off -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-emulator-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tcg-api-${{ matrix.api-level }}-diagnostics
          path: |
            /tmp/yehaw-emulator-logcat.txt
            /tmp/yehaw-emulator-meminfo.txt
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
