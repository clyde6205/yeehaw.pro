name: Static product site checks

on:
  pull_request:
    paths:
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/static-site.yml"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/static-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
