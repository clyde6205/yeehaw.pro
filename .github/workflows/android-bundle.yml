name: Android App Bundle (Play upload format)

on:
  push:
    branches: ["integration/reconcile-main", "wip/quick-tools"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/android-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Release AAB (R8-minified, throwaway-signed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.11.1"
      - name: "Build release bundle (no production key is available to CI)"
        run: gradle --no-daemon :app:bundleRelease
      - name: "Sign with a THROWAWAY key so the bundle can be inspected (NOT the Play upload key)"
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore /tmp/throwaway.jks -storepass throwaway -keypass throwaway -alias t -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI throwaway"
          jarsigner -keystore /tmp/throwaway.jks -storepass throwaway -keypass throwaway -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" t
          jarsigner -verify "$AAB" | head -3
      - name: Inspect the bundle
        run: |
          echo "=== file"; ls -l "$AAB"; sha256sum "$AAB"
          echo "=== zip integrity"; unzip -tq "$AAB"
          for e in BundleConfig.pb base/manifest/AndroidManifest.xml base/dex/classes.dex base/resources.pb; do
            unzip -l "$AAB" | grep -q " $e$" && echo "present: $e" || { echo "::error::MISSING $e in AAB"; exit 1; }
          done
          echo "=== native libraries (expect none)"; unzip -Z1 "$AAB" | grep -E "/lib/" || echo "none"
          echo "=== debug artifacts (expect none)"; unzip -Z1 "$AAB" | grep -iE "debug|\.kotlin_module|proguard" || echo "none"
          echo "entries total: $(unzip -Z1 "$AAB" | wc -l)"
          echo "=== version in proto manifest (strings)"; unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -E "app\.yehaw\.browser|0\.6\.0" | head -5
      - name: "Record the bundle in the log"
        run: |
          echo "-----BEGIN YEEHAW AAB BASE64-----"
          base64 -w 120 "$AAB"
          echo "-----END YEEHAW AAB BASE64-----"
