name: Android emulator smoke tests

on:
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/android-emulator-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/android-emulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    name: API ${{ matrix.api-level }} browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # Emulator VMs compete heavily for RAM/CPU on hosted runners. Serial execution
      # makes the API 35 run reliable and preserves the full API coverage.
      max-parallel: 1
      matrix:
        api-level: [23, 29, 35]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run browser smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest
            test_result=$?
            if [ "$test_result" -ne 0 ]; then
              adb logcat -d -v time > /tmp/yehaw-emulator-logcat.txt
              adb shell dumpsys meminfo > /tmp/yehaw-emulator-meminfo.txt
            fi
            exit "$test_result"
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-diagnostics
          path: |
            /tmp/yehaw-emulator-logcat.txt
            /tmp/yehaw-emulator-meminfo.txt
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
