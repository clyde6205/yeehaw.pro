name: Android lint

on:
  push:
    branches: ["integration/reconcile-main", "wip/quick-tools"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - ".github/workflows/android-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Android lint (release variant)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.11.1"
      - name: Run lint (fails the job on any lint error)
        run: gradle --no-daemon :app:lintRelease
      - name: Print the findings
        if: always()
        run: |
          f=$(ls app/build/reports/lint-results-release.txt 2>/dev/null | head -1)
          if [ -n "$f" ]; then cat "$f" | head -300; else echo "no lint text report produced"; fi
