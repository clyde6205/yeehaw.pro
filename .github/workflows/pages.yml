name: Deploy website to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ 'index.html', 'sw.js', 'manifest.json', 'icons/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          cp sw.js site/ 2>/dev/null || true
          cp manifest.json site/ 2>/dev/null || true
          cp -r icons site/ 2>/dev/null || true
          cp PRIVACY.md site/ 2>/dev/null || true
          echo "yeehaw.pro" > site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
