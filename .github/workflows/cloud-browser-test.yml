name: Cloud browser tests

on:
  pull_request:
    paths:
      - "api/_browser/**"
      - "api/render.js"
      - "api/resource.js"
      - "api/browser-health.js"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloud-browser-test.yml"
  push:
    branches: ["main", "feat/**"]
    paths:
      - "api/_browser/**"
      - "api/render.js"
      - "api/resource.js"
      - "api/browser-health.js"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloud-browser-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Check endpoint syntax
        run: npm run check
