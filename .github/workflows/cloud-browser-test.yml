name: Cloud browser tests

on:
  pull_request:
    paths:
      - "api/_browser/**"
      - "api/render.js"
      - "api/resource.js"
      - "api/browser-health.js"
      - "tests/**"
      - "package.json"
      - ".github/workflows/cloud-browser-test.yml"
  push:
    branches: ["main", "feat/**"]
    paths:
      - "api/_browser/**"
      - "api/render.js"
      - "api/resource.js"
      - "api/browser-health.js"
      - "tests/**"
      - "package.json"
      - ".github/workflows/cloud-browser-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund
      - name: Commit generated npm lockfile
        run: |
          if [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: lock cloud browser dependencies"
              git push
            fi
          fi
      - name: Run automated tests
        run: npm test
      - name: Check endpoint syntax
        run: npm run check
