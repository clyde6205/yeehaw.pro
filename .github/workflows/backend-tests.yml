name: Backend tests

on:
  pull_request:
    paths: ["console/backend/**", ".github/workflows/backend-tests.yml"]
  push:
    branches: ["main", "integration/reconcile-main"]
    paths: ["console/backend/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yh
          POSTGRES_PASSWORD: yhpass
          POSTGRES_DB: yeehaw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yh" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Install and test
        working-directory: console/backend
        env:
          TEST_DATABASE_URL: postgres://yh:yhpass@localhost:5432/yeehaw_test
        run: |
          npm ci
          npm test
      - name: Dependency audit (fails on high or critical)
        working-directory: console/backend
        run: npm audit --omit=dev --audit-level=high
