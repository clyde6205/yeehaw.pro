image: cimg/android:2025.01.1

pipelines:
  default:
    - step:
        name: Build YeeHaw debug and release APKs
        max-time: 25
        script:
          - yes | sdkmanager --licenses > /dev/null || true
          - sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          - curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          - unzip -q /tmp/gradle.zip -d $HOME
          - export PATH=$HOME/gradle-8.11.1/bin:$PATH
          - gradle --no-daemon :app:assembleDebug :app:assembleRelease
          - ls -lh app/build/outputs/apk/debug/app-debug.apk
          - find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print
        artifacts:
          - app/build/outputs/apk/debug/app-debug.apk
          - app/build/outputs/apk/release/**
