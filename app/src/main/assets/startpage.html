<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>YeeHaw — Start</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#080d18;color:#f3f7ff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;min-height:100vh}
  header{padding:22px 18px 6px}
  .brand{font-weight:900;letter-spacing:-.05em;font-size:1.25rem;color:#b8f36b}
  .brand span{color:#f3f7ff}
  form{padding:10px 18px 4px}
  .search{display:flex;gap:8px}
  input{flex:1;min-height:46px;border:1px solid #344761;border-radius:12px;background:#18263a;
    color:#dce8f7;font-size:15px;padding:10px 14px;outline:none}
  input:focus{border-color:#b8f36b}
  button{border:0;border-radius:12px;background:#b8f36b;color:#101b0b;font-weight:800;font-size:14px;padding:0 18px;min-height:46px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#f3f7ff}
  .icon{width:56px;height:56px;border-radius:14px;background:#17263b;border:1px solid #26364d;
    display:grid;place-items:center;font-size:22px;color:#b8f36b}
  .icon:nth-child(3n){color:#82b7ff}
  .tile:active .icon{background:#213a55}
  .label{font-size:.72rem;color:#a5b4ca;text-align:center}
  .tagline{padding:6px 22px 26px;color:#a5b4ca;font-size:.88rem;text-align:center}
  .tagline b{color:#f3f7ff;display:block;font-size:1.02rem;margin-bottom:5px}
  nav{margin-top:auto;display:flex;justify-content:space-around;padding:12px 10px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid #1a2637;background:#0d1523}
  nav a{color:#a9b9ce;font-size:19px;padding:10px 14px;text-decoration:none}
  nav a:active{color:#b8f36b}
</style>
</head>
<body>
  <header><div class="brand">yee<span>Haw</span> · browser</div></header>
  <form onsubmit="event.preventDefault();var q=document.getElementById('q').value.trim();if(q){location.href='?a=search&q='+encodeURIComponent(q);}return false;">
    <div class="search">
      <input id="q" type="search" placeholder="Search or enter website address" autocomplete="off" autocapitalize="off">
      <button type="submit" aria-label="Go">Go</button>
    </div>
  </form>
  <div class="tiles">
    <a class="tile" href="?a=home"><span class="icon">&#8962;</span><span class="label">Home</span></a>
    <a class="tile" href="?a=saved"><span class="icon">&#9733;</span><span class="label">Saved</span></a>
    <a class="tile" href="?a=downloads"><span class="icon">&#8595;</span><span class="label">Files</span></a>
    <a class="tile" href="?a=tabs"><span class="icon">&#9776;</span><span class="label">Tabs</span></a>
    <a class="tile" href="?a=privacy"><span class="icon">&#9678;</span><span class="label">Privacy</span></a>
    <a class="tile" href="?a=find"><span class="icon">&#8981;</span><span class="label">Find</span></a>
    <a class="tile" href="?a=history"><span class="icon">&#8942;</span><span class="label">History</span></a>
    <a class="tile" href="?a=newtab"><span class="icon">&#65291;</span><span class="label">New tab</span></a>
  </div>
  <div class="tagline"><b>Your web, without the clutter.</b>A simple browser surface for the pages you need.</div>
  <nav>
    <a href="javascript:history.back()" aria-label="Back">&#8249;</a>
    <a href="javascript:history.forward()" aria-label="Forward">&#8250;</a>
    <a href="?a=newtab" aria-label="New tab">&#65291;</a>
    <a href="?a=more" aria-label="Menu">&#8942;</a>
  </nav>
</body>
</html>
