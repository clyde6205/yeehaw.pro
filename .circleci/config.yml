version: 2.1

jobs:
  android-build:
    docker:
      - image: cimg/android:2026.10.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Android SDK 36 components
          command: |
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run:
          name: Install Gradle 8.11.1
          command: |
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle.zip -d "$HOME/gradle"
            echo "export PATH=$HOME/gradle/gradle-8.11.1/bin:$PATH" >> "$BASH_ENV"
      - run:
          name: Build debug and release APKs
          command: |
            gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - store_artifacts:
          path: app/build/outputs/apk
          destination: apks

workflows:
  build:
    jobs:
      - android-build
